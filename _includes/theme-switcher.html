<div class="theme-toolbar">
  <div class="theme-switcher" hidden>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-expanded="false" aria-controls="theme-options">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0Zm0 1.5a6.5 6.5 0 0 1 0 13Z"/></svg>
      <span>Theme: <span id="theme-label">System</span></span>
      <span aria-hidden="true">▾</span>
    </button>
    <fieldset class="theme-options" id="theme-options" hidden>
      <legend class="sr-only">Color theme</legend>
      <label><input type="radio" name="theme" value="system"> System</label>
      <label><input type="radio" name="theme" value="light"> Light</label>
      <label><input type="radio" name="theme" value="dark"> Dark</label>
    </fieldset>
  </div>
</div>
