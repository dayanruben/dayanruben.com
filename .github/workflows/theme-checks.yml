name: Theme checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  themes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
        env:
          THEME_ARTIFACTS: ${{ runner.temp }}/theme-validation
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: theme-validation
          path: ${{ runner.temp }}/theme-validation
          if-no-files-found: ignore
